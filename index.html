<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPro Manager - Trainer Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<style>
    body {
        font-family: 'Inter', sans-serif;
    }
    .session-card:hover {
        transform: translateY(-2px);
        transition: all 0.3s ease;
    }
    .attendance-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
    }
</style>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- Sidebar -->
        <aside class="fixed top-0 left-0 h-screen w-64 bg-blue-600 text-white p-4">
            <div class="mb-8">
                <h1 class="text-2xl font-bold">FitPro Manager</h1>
            </div>
            <nav>
                <ul class="space-y-2">
                    <li>
                        <a href="#dashboard" class="flex items-center p-2 rounded hover:bg-blue-700">
                            <i class="bi bi-grid-1x2-fill mr-3"></i>
                            Dashboard
                        </a>
                    </li>
                    <li>
                        <a href="#clients" class="flex items-center p-2 rounded hover:bg-blue-700">
                            <i class="bi bi-people-fill mr-3"></i>
                            Clients
                        </a>
                    </li>
                    <li>
                        <a href="#sessions" class="flex items-center p-2 rounded hover:bg-blue-700">
                            <i class="bi bi-calendar-event mr-3"></i>
                            Sessions
                        </a>
                    </li>
                    <li>
                        <a href="#attendance" class="flex items-center p-2 rounded hover:bg-blue-700">
                            <i class="bi bi-check2-square mr-3"></i>
                            Attendance
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="ml-64 p-8">
            <!-- Header -->
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h2 class="text-2xl font-bold">Welcome back, Trainer!</h2>
                    <p class="text-gray-600">Here's your activity overview</p>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="checkInBtn" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600">
                        Check In
                    </button>
                    <div class="relative">
                        <img src="https://images.unsplash.com/photo-1633332755192-727a05c4013d?auto=format&fit=crop&w=50&h=50" 
                             alt="Profile" class="w-10 h-10 rounded-full cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- Stats Grid -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-gray-500 text-sm">Total Clients</h3>
                    <p class="text-3xl font-bold">24</p>
                </div>
                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-gray-500 text-sm">Today's Sessions</h3>
                    <p class="text-3xl font-bold">8</p>
                </div>
                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-gray-500 text-sm">Hours Worked</h3>
                    <p class="text-3xl font-bold">6.5</p>
                </div>
                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-gray-500 text-sm">Completion Rate</h3>
                    <p class="text-3xl font-bold">92%</p>
                </div>
            </div>

            <!-- Upcoming Sessions -->
            <div class="mb-8">
                <h3 class="text-xl font-bold mb-4">Upcoming Sessions</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="sessionContainer">
                    <!-- Sessions will be dynamically added here -->
                </div>
            </div>

            <!-- Attendance Calendar -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="text-xl font-bold mb-4">Monthly Attendance</h3>
                <div class="grid grid-cols-7 gap-2 text-center" id="attendanceCalendar">
                    <!-- Calendar will be dynamically generated -->
                </div>
            </div>
        </main>
    </div>

    <script>
        // Sample session data
        const sessions = [
            {
                client: "John Doe",
                time: "09:00 AM",
                type: "Personal Training",
                status: "upcoming"
            },
            {
                client: "Jane Smith",
                time: "10:30 AM",
                type: "Group Session",
                status: "upcoming"
            },
            {
                client: "Mike Johnson",
                time: "02:00 PM",
                type: "Personal Training",
                status: "upcoming"
            }
        ];

        // Render sessions
        function renderSessions() {
            const container = document.getElementById('sessionContainer');
            container.innerHTML = sessions.map(session => `
                <div class="bg-white p-6 rounded-lg shadow session-card hover:shadow-lg">
                    <div class="flex justify-between items-center mb-4">
                        <h4 class="font-bold">${session.client}</h4>
                        <span class="text-blue-600">${session.time}</span>
                    </div>
                    <p class="text-gray-600 mb-4">${session.type}</p>
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-gray-500">Duration: 1h</span>
                        <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                            Start Session
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Generate attendance calendar
        function generateCalendar() {
            const calendar = document.getElementById('attendanceCalendar');
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            
            // Add day headers
            days.forEach(day => {
                calendar.innerHTML += `<div class="font-bold text-gray-600">${day}</div>`;
            });

            // Add calendar dates
            for(let i = 1; i <= 31; i++) {
                const attendance = Math.random() > 0.2;
                calendar.innerHTML += `
                    <div class="p-2 border rounded flex flex-col items-center">
                        <span class="mb-1">${i}</span>
                        <div class="attendance-dot ${attendance ? 'bg-green-500' : 'bg-gray-300'}"></div>
                    </div>
                `;
            }
        }

        // Check In/Out functionality
        let isCheckedIn = false;
        const checkInBtn = document.getElementById('checkInBtn');
        checkInBtn.addEventListener('click', () => {
            isCheckedIn = !isCheckedIn;
            checkInBtn.textContent = isCheckedIn ? 'Check Out' : 'Check In';
            checkInBtn.className = isCheckedIn 
                ? 'bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600'
                : 'bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600';
        });

        // Initialize
        renderSessions();
        generateCalendar();
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
